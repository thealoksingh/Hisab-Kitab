server.port=8080
server.address=0.0.0.0
# This configuration is for localhost server
# spring.datasource.url=jdbc:mysql://localhost:3306/hisabkitab
# spring.datasource.username=root
# spring.datasource.password=root

# This configuration is for production server on cpanel
spring.datasource.url=${HISABKITAB_DATASOURCE_URL}
spring.datasource.username=${HISABKITAB_DATASOURCE_USERNAME}
spring.datasource.password=${HISABKITAB_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update  
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.servlet.context-path=/Hisab-Kitab
server.forward-headers-strategy=native


#This config is used for enable authorization in swagger
springdoc.swagger-ui.oauth.client-id=swagger-ui
springdoc.swagger-ui.oauth.client-secret=swagger-secret
springdoc.swagger-ui.oauth.use-basic-auth=true
springdoc.swagger-ui.oauth.realm=Swagger UI

#springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.api-docs.path=/v3/api-docs

# JWT Configuration
jwt.secret=${HISABKITAB_SECRET_KEY}
jwt.expirationInMs=${HISABKITAB_ACCESS_TOKEN_EXPIRATION}
hisab-kitab.app.jwtRefreshExpirationDay=${HISABKITAB_REFRESH_TOKEN_EXPIRATION}
# 15 minute
# # 1 day
# jwt.expirationInMs=60000000
# hisab-kitab.app.jwtRefreshExpirationDay=1
# jwt.secret=-----------------------------Your Secret Key-----------------------------
# # Ensure that secret key is strong and secure atleast 32 characters

# Kafka Config
spring.kafka.bootstrap-servers={HISAKITAB_KAFKA_SERVICE}
spring.kafka.consumer.group-id=hisab-kitab-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=60000
spring.kafka.producer.properties.retries=3
# Disable Kafka admin auto-configuration if Kafka is not available
spring.kafka.admin.auto-create=true


# ========== WEBSOCKET (Optional) ==========
# You can add CORS or security configs in WebSocketConfig.java if needed

# ========== LOGGING (Optional but useful) ==========
logging.level.org.apache.kafka=ERROR