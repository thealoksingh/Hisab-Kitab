# Production Configuration
server.port=8080

# SSL/HTTPS Configuration (if using SSL termination at load balancer, these might not be needed)
# server.ssl.enabled=false

# CORS Configuration
cors.allowed-origins=https://hisab-kitab-business.netlify.app,http://localhost:3000,http://127.0.0.1:3000

# WebSocket Configuration
websocket.allowed-origins=https://hisab-kitab-business.netlify.app,http://localhost:3000,http://127.0.0.1:3000

# Logging
logging.level.com.hisabKitab.springProject=INFO
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG